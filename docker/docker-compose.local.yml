services:
  db:
    image: postgres:16-alpine
    container_name: fitness-db-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fitness
    ports:
      - "5432:5432"
    volumes:
      - fitness_pgdata_local:/var/lib/postgresql/data

volumes:
  fitness_pgdata_local:

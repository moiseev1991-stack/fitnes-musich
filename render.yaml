# Render Blueprint: Fitness Diary (free tier)
# Deploy: push to GitHub, then in Render Dashboard: New → Blueprint → connect this repo

databases:
  - name: fitnes-db
    plan: free
    databaseName: fitnes

services:
  - type: web
    name: fitnes
    runtime: node
    plan: free

    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npx next start -p $PORT

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fitnes-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
